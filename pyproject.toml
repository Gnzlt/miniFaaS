[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minifaas"
description = "One container that serves a git repo's Functions Framework (and Firebase) Python functions over HTTP and on their schedules, with a small dashboard."
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.13"
license = { file = "LICENSE" }
keywords = ["faas", "serverless", "functions-framework", "firebase", "cron", "git", "docker", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Server",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "starlette>=0.41,<2.0",
    "uvicorn>=0.30,<1.0",
    "apscheduler>=3.10,<4.0",
    "pydantic-settings>=2.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/Gnzlt/miniFaaS"
Issues = "https://github.com/Gnzlt/miniFaaS/issues"

[tool.hatch.version]
# The one place the version is written; the release workflow checks the git tag against it.
path = "src/minifaas/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/minifaas"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["T201"]
